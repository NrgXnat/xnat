custom_forms:
  - 'xnat-web/src/main/java/org/nrg/xnat/customforms/**'
  - 'xnat-web/src/main/java/org/nrg/xnat/services/customfields/**'
  - 'xnat-web/src/main/java/org/nrg/xapi/rest/customfields/**'

custom-variables:
  # legacy per-datatype fields (xnat:fieldDefinitionGroup), predates Custom Forms.
  # xnat.xsd is the single schema file for every XNAT data type, so this is a
  # broad, low-selectivity trigger -- it's the finest granularity available
  # since fieldDefinitionGroup isn't split into its own file.
  - 'xnat-web/src/main/resources/schemas/xnat/xnat.xsd'
  - 'xnat-web/src/main/java/org/nrg/xdat/om/base/BaseXnatFielddefinitiongroup*.java'
  - 'xnat-web/src/main/java/org/nrg/xdat/om/base/BaseXnatSubjectdata.java'
  - 'xnat-web/src/main/java/org/nrg/xdat/om/base/BaseXnatExperimentdata.java'
  - 'xnat-web/src/main/java/org/nrg/xdat/om/base/BaseXnatProjectdata.java'
  - 'xnat-web/src/main/java/org/nrg/xdat/om/base/BaseXnatDatatypeprotocol.java'

schemas: &schemas
  - 'xdat/src/main/java/org/nrg/xft/schema/**'
  - 'xnat-web/src/main/java/org/nrg/xapi/rest/data/DBBackedSchemaApi.java'
  - 'xnat-web/src/main/java/org/nrg/xapi/rest/data/DataTypesApi.java'
  - 'xnat-web/src/main/java/org/nrg/xapi/rest/data/XFTElementApi.java'
  - 'xnat-web/src/main/java/org/nrg/xapi/rest/schemas/SchemaApi.java'
  - 'xnat-web/src/main/java/org/nrg/xdat/model/**'
  - 'xnat-web/src/main/resources/schemas/**'
data-types: *schemas
db-schemas: *schemas
xft-elements: *schemas

permissions: &permissions
  - 'xdat/src/main/java/org/nrg/xdat/security/**'
  - 'xnat-web/src/main/java/org/nrg/xdat/om/base/BaseXnatExperimentdataShare.java'
  - 'xnat-web/src/main/java/org/nrg/xdat/om/base/BaseXnatImagescandataShare.java'
  # xapi-level authorization: annotation, enforcing aspect, and every AccessLevel impl
  - 'xdat/src/main/java/org/nrg/xapi/authorization/**'
  - 'xdat/src/main/java/org/nrg/xapi/rest/aspects/XapiRequestMappingAspect.java'
  - 'xdat/src/main/java/org/nrg/xapi/rest/AuthDelegate.java'
  - 'xdat/src/main/java/org/nrg/xapi/rest/XapiRequestMapping.java'
  - 'xnat-web/src/main/java/org/nrg/xapi/authorization/**'
  # groups/roles/permissions caching -- read-access checks route through this
  - 'xdat/src/main/java/org/nrg/xdat/services/cache/GroupsAndPermissionsCache.java'
  - 'xnat-web/src/main/java/org/nrg/xnat/services/cache/DefaultGroupsAndPermissionsCache.java'
  # site-wide/role-based data access surface (ALL_DATA_ADMIN/ALL_DATA_ACCESS)
  - 'xnat-web/src/main/java/org/nrg/xapi/rest/users/DataAccessApi.java'
  - 'xnat-web/src/main/java/org/nrg/xapi/rest/users/RoleBasedDataAccessApi.java'
  # request-access-to-project workflow, prearchive-specific access checks
  - 'xnat-web/src/main/java/org/nrg/xnat/turbine/modules/actions/RequestAccess.java'
  - 'xnat-web/src/main/java/org/nrg/xnat/helpers/prearchive/PrearcUtils.java'
  - 'xnat-web/src/main/java/org/nrg/xnat/ajax/Prearchive.java'
sharing: *permissions

config-service: &config_service
  - 'config/src/main/java/org/nrg/config/**'
  - 'prefs/src/main/java/org/nrg/prefs/**'
  - 'xdat/src/main/java/org/nrg/xdat/preferences/SiteConfigPreferences.java'
  - 'xnat-web/src/main/java/org/nrg/xapi/rest/settings/SiteConfigApi.java'
preferences: *config_service
open-xnat: *config_service

