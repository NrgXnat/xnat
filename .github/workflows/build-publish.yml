name: Build and Publish

on:
  push:
    branches:
      - master
      - develop
      - github-build   # for pipeline testing; remove once verified
  workflow_dispatch:
    # Manual runs let you cherry-pick which publish paths execute.
    # All boolean inputs default to false — clicking "Run workflow"
    # with nothing checked produces a build-only run, which is the
    # safe default for pipeline debugging.
    inputs:
      publish_s3:
        description: 'Upload WAR to AWS S3'
        type: boolean
        default: false
      publish_docker:
        description: 'Build and push Docker image to Docker Hub'
        type: boolean
        default: false
      publish_jfrog:
        description: 'Publish all modules to JFrog Artifactory'
        type: boolean
        default: false

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ─────────────────────────── 1. Build the WAR ───────────────────────────
  # NOTE (debug): runs-on temporarily set to standard ubuntu-latest (16 GB)
  # to validate the pipeline without provisioning a larger runner. The
  # full parallel build with :config:test (-Xmx8g) needs ~32 GB peak, so
  # Stage 1 below skips tests (-x test) to fit. Restore to
  #   runs-on: ubuntu-latest-8-cores
  # and drop the -x test once larger runner is available.
  build:
    name: Build WAR
    runs-on: ubuntu-latest
    outputs:
      war-name: ${{ steps.find-war.outputs.name }}
      version:  ${{ steps.gradle-props.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Persist the full ~/.gradle/caches directory between runs,
          # including caches/build-cache-1 so task outputs (compileJava
          # JARs, war contents, ANTLR-generated sources, etc.) can be
          # restored across runs as FROM-CACHE. The default action
          # config only caches modules-2 (Maven deps), which is why
          # the first b67d50ea3 run still re-ran every compile task.
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      - name: Read project version
        id: gradle-props
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Temporary debug aid — confirm the actual runner specs we're given.
      # Remove once we're done validating the standard runner.
      - name: Show runner specs (debug)
        run: |
          echo "vCPUs:     $(nproc)"
          echo "Memory:    $(free -h | awk '/Mem:/ {print $2}')"
          echo "Disk free: $(df -h / | awk 'NR==2 {print $4}')"
          echo "Kernel:    $(uname -srm)"

      # Stage 1: build all modules. Produces module JARs and
      # xnat-web/build/libs/*.war. Outputs are kept on disk so Stage 2 can
      # reuse them via Gradle incremental build.
      #
      # No `clean`: each GitHub Actions runner starts with an empty
      # workspace, so there's nothing stale to clean. Gradle's build
      # cache (org.gradle.caching=true in gradle.properties) is
      # persisted across runs by setup-gradle@v4, so task outputs are
      # restored quickly on subsequent runs when the source is unchanged.
      #
      # NOTE (debug): -x test is here temporarily to fit on the standard
      # 16 GB runner. Once we move to ubuntu-latest-8-cores, drop -x test.
      - name: Stage 1 — Build (parallel, tests skipped for debug)
        run: ./gradlew build -x test

      # Stage 2: publish every module to JFrog Artifactory. Reuses Stage 1
      # outputs; only generatePomFile + HTTP upload runs here.
      #
      # Runs when:
      #   - push to master / develop (auto-publish on merge)
      #   - manual workflow_dispatch with publish_jfrog checked
      # github-build pushes never publish to JFrog.
      - name: Stage 2 — Publish all modules to JFrog Artifactory
        if: |
          (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
          || (github.event_name == 'workflow_dispatch' && inputs.publish_jfrog)
        env:
          ORG_GRADLE_PROJECT_artifactoryUser:  ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_artifactoryToken: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: ./gradlew publish -x test

      - name: Locate produced WAR
        id: find-war
        run: |
          WAR=$(ls xnat-web/build/libs/*.war | head -n 1)
          echo "Found WAR: $WAR"
          echo "name=$(basename "$WAR")" >> "$GITHUB_OUTPUT"

      - name: Upload WAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xnat-war
          path: xnat-web/build/libs/*.war
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────── 2. Publish WAR to S3 ───────────────────────
  # Runs when:
  #   - push to any non-github-build branch (master/develop)
  #   - manual workflow_dispatch with publish_s3 checked
  publish-s3:
    name: Publish WAR to S3
    needs: build
    if: |
      (github.event_name == 'push' && github.ref_name != 'github-build')
      || (github.event_name == 'workflow_dispatch' && inputs.publish_s3)
    runs-on: ubuntu-latest
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: xnat-war
          path: ./artifacts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Upload WAR to S3 (versioned + latest)
        env:
          BUCKET:  ${{ secrets.AWS_S3_BUCKET }}
          BRANCH:  ${{ github.ref_name }}
          SHA:     ${{ github.sha }}
          WAR:     ${{ needs.build.outputs.war-name }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA::7}"
          aws s3 cp "./artifacts/${WAR}" \
            "s3://${BUCKET}/xnat/${BRANCH}/${SHORT_SHA}/${WAR}"
          aws s3 cp "./artifacts/${WAR}" \
            "s3://${BUCKET}/xnat/${BRANCH}/latest.war"
          echo "Uploaded to s3://${BUCKET}/xnat/${BRANCH}/${SHORT_SHA}/${WAR}"
          echo "Uploaded to s3://${BUCKET}/xnat/${BRANCH}/latest.war"

  # ───────────────── 3. Build Docker image and push to Docker Hub ─────────
  # Runs when:
  #   - push to any non-github-build branch (master/develop)
  #   - manual workflow_dispatch with publish_docker checked
  publish-docker:
    name: Build & Push Docker Image
    needs: build
    if: |
      (github.event_name == 'push' && github.ref_name != 'github-build')
      || (github.event_name == 'workflow_dispatch' && inputs.publish_docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for Dockerfile + edit-log.py)
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: xnat-war
          path: ./docker-context

      - name: Normalise WAR file name
        run: |
          set -euo pipefail
          mv ./docker-context/*.war ./docker-context/xnat.war
          ls -lh ./docker-context

      # XNAT's default logback.xml uses RollingFileAppender, so logs go to
      # files inside the container and `docker logs` shows nothing useful.
      # Rewrite all <appender> classes to ConsoleAppender and prefix the
      # encoder pattern with [<appenderName>] so streams are distinguishable.
      # Mirrors what the old Jenkins docker-build.sh did with edit-log.py.
      - name: Rewrite logback.xml inside WAR (ConsoleAppender for container logs)
        working-directory: ./docker-context
        run: |
          set -euo pipefail
          LOGBACK=WEB-INF/classes/logback.xml
          echo "=== logback.xml BEFORE ==="
          unzip -p xnat.war "$LOGBACK" | head -40
          jar xf xnat.war "$LOGBACK"
          python3 ../scripts/edit-log.py --logfile "$LOGBACK"
          jar uf xnat.war "$LOGBACK"
          echo "=== logback.xml AFTER ==="
          cat "$LOGBACK"
          rm -rf WEB-INF META-INF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          USER:    ${{ secrets.DOCKERHUB_USERNAME }}
          BRANCH:  ${{ github.ref_name }}
          SHA:     ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          SHORT_SHA="${SHA::7}"
          REPO="${USER}/xnat"
          TAGS="${REPO}:${BRANCH},${REPO}:${BRANCH}-${SHORT_SHA},${REPO}:${VERSION}-${BRANCH}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Image tags: ${TAGS}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
