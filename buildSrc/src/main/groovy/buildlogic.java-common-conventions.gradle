import java.net.HttpURLConnection
import java.util.Base64
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository

plugins {
    id 'java'
    id 'maven-publish'
    id 'jacoco'
    id 'idea'
    id 'eclipse'
}

// group and version are set by root build.gradle allprojects block
// Modules that need different group (e.g. org.nrg.xnat) override in their own build.gradle

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

repositories {
    maven { url 'https://nrgxnat.jfrog.io/nrgxnat/libs-release' }
    maven { url 'https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot' }
    mavenCentral()
    maven { url 'https://maven.dcm4che.org' }
    maven { url 'https://raw.githubusercontent.com/nroduit/mvn-repo/master/' }
    maven { url 'https://jitpack.io' }
}

// --- Jacoco ---

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}

// --- IDEA ---

idea {
    module {
        inheritOutputDirs = false
        outputDir = compileJava.destinationDirectory.get().asFile
        testOutputDir = compileTestJava.destinationDirectory.get().asFile
    }
}

// --- Test ---

test {
    useJUnitPlatform()
    systemProperties['xnat.home'] = layout.buildDirectory.dir('tmp/test').get().asFile.absolutePath
}

// --- Lombok (all modules use it) ---

dependencies {
    compileOnly 'org.projectlombok:lombok:' + libs.versions.lombok.get()
    annotationProcessor 'org.projectlombok:lombok:' + libs.versions.lombok.get()
    testCompileOnly 'org.projectlombok:lombok:' + libs.versions.lombok.get()
    testAnnotationProcessor 'org.projectlombok:lombok:' + libs.versions.lombok.get()
    // JUnit Platform launcher (required by Gradle 9)
    // Platform version 1.x.y maps to Jupiter 5.x.y (e.g. Jupiter 5.8.1 → Platform 1.8.1)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.1'
    // JUnit 4 tests run on JUnit Platform via vintage engine
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:' + libs.versions.junit.jupiter.get()
}

// --- Reactor 2.x: redisson 3.22.0 pulls reactor-core 3.x, framework needs 2.x ---
// Multiple modules declare redisson; force in convention plugin is cleanest

configurations.configureEach {
    resolutionStrategy {
        force 'io.projectreactor:reactor-core:2.0.8.RELEASE'
        force 'io.projectreactor:reactor-bus:2.0.8.RELEASE'
    }
}

// --- Compiler & Javadoc ---

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

// --- Manifest (build info for all JARs) ---

def buildDate = new Date()
def buildNumber = System.getenv().BUILD_NUMBER?.toInteger() ?: 'Manual'

tasks.withType(Jar).configureEach {
    manifest {
        attributes 'Build-Date': buildDate,
                   'Build-Number': buildNumber,
                   'Implementation-Version': project.version
    }
}

// --- Publishing ---

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'XNAT_Artifactory'
            // CI injects ORG_GRADLE_PROJECT_artifactoryUser/Token env vars.
            // Local devs can set artifactoryUser/Token in ~/.gradle/gradle.properties.
            credentials {
                username = (project.findProperty('artifactoryUser')  ?: System.getenv('ARTIFACTORY_USER'))  ?: ''
                password = (project.findProperty('artifactoryToken') ?: System.getenv('ARTIFACTORY_TOKEN')) ?: ''
            }
        }
    }
}

// Decide snapshot-vs-release URL lazily, after each subproject's
// build.gradle has run — needed because modules like dicom-edit6
// override `project.version` to a non-SNAPSHOT release (6.9.0).
// If we evaluate `project.version` at the time this convention is
// applied, we'd see the root-level 1.10.1-SNAPSHOT and lock the URL
// to the snapshot repo, which then rejects release artifacts with 409.
afterEvaluate {
    publishing.repositories.named('XNAT_Artifactory').configure {
        url = project.version.toString().endsWith('-SNAPSHOT')
            ? 'https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot-local'
            : 'https://nrgxnat.jfrog.io/nrgxnat/libs-release-local'
    }
}

// --- Skip publish if the release artifact already exists in Artifactory ---
//
// JFrog libs-release-local rejects redeploys with HTTP 409. Modules with
// independent, non-SNAPSHOT versions (e.g. dicom-edit6 6.9.0) hit this on
// every CI run after the first one, breaking the whole `./gradlew publish`.
// HEAD-probe the main jar before publishing; if it already exists, skip
// that module's publish task so the rest of the build keeps moving.
//
// SNAPSHOT versions are never probed (their repo allows redeploys).
tasks.withType(PublishToMavenRepository).configureEach { publishTask ->
    onlyIf("artifact not already present in Artifactory") {
        if (project.version.toString().endsWith('-SNAPSHOT')) {
            return true
        }
        def repo = publishTask.repository
        def repoUrl = repo.url.toString().replaceAll('/$', '')
        def groupPath = project.group.toString().replace('.', '/')
        def jarUrl = "${repoUrl}/${groupPath}/${project.name}/${project.version}/${project.name}-${project.version}.jar"

        def conn = new URL(jarUrl).openConnection() as HttpURLConnection
        conn.requestMethod = 'HEAD'
        conn.connectTimeout = 10_000
        conn.readTimeout = 10_000
        def user = repo.credentials.username
        def pwd  = repo.credentials.password
        if (user && pwd) {
            def auth = Base64.encoder.encodeToString("${user}:${pwd}".bytes)
            conn.setRequestProperty('Authorization', "Basic ${auth}")
        }
        try {
            def code = conn.responseCode
            if (code == 200) {
                logger.warn("[publish] SKIP {}:{} — already exists at {}",
                            project.name, project.version, jarUrl)
                return false
            }
            if (code != 404) {
                logger.warn("[publish] HEAD {} returned {} — proceeding anyway",
                            jarUrl, code)
            }
            return true
        } catch (Exception e) {
            logger.warn("[publish] HEAD probe failed for {} ({}) — proceeding anyway",
                        jarUrl, e.message)
            return true   // network glitch shouldn't block publish; let PUT decide
        } finally {
            conn.disconnect()
        }
    }
}
