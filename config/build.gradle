plugins {
    id 'buildlogic.java-library-conventions'
}

dependencies {
    api project(':prefs')

    implementation libs.commons.beanutils
    implementation libs.spring.orm
    implementation libs.spring.context
    implementation libs.hibernate.core
    implementation libs.commons.lang3
    implementation libs.cglib.cglib
    implementation libs.javassist.javassist
    implementation libs.google.guava
    implementation libs.jackson.databind

    compileOnly libs.servlet.javax.servlet.api

    testImplementation libs.servlet.javax.servlet.api
    testImplementation project(':test')
    testImplementation libs.h2database.h2
    testImplementation libs.postgresql.postgresql
    testImplementation libs.slf4j.simple
    testImplementation libs.junit.junit
    testImplementation libs.commons.io
    testImplementation libs.spring.test
    testImplementation libs.assertj.core
}

test {
    // ConfigPlatformTests.testLargeConfigFile allocates a String backed
    // by char[MAX_FILE_LENGTH+1] (1 GB chars = 2 GB on-heap) to verify
    // the >1GB rejection path. Real measured peak heap: ~4.5 GB across
    // the whole test class. 5g leaves ~10% headroom; the historical
    // 8g was overprovisioned. See:
    //   ~/bindocs/work/xnat/xnat-monorepo-gradle-build-memory-budget.md
    jvmArgs '-Xmx5g'
}
