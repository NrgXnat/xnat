plugins {
    id 'buildlogic.java-library-conventions'
}

// Original Maven coordinate: org.nrg:DicomImageUtils
publishing {
    publications {
        maven {
            artifactId = 'DicomImageUtils'
        }
    }
}

dependencies {
    api project(':mizer')
    api libs.dcm4che5.dcm4che.core
    api libs.dcm4che5.dcm4che.image
    api libs.dcm4che5.dcm4che.imageio

    implementation libs.commons.lang3
    implementation libs.slf4j.api

    testImplementation libs.junit.junit
}
