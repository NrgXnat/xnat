# Local Tomcat 9 + PostgreSQL + ActiveMQ stack for runtime-validating the Phase 0
# migration WAR (Restlet 2.5.2 / Turbine 5.1 / Velocity 2.4.1, still javax / Tomcat 9).
#
# Quick start:
#   ./docker/stage-war.sh        # builds :xnat-web:war -> docker-context/xnat.war
#   docker compose up --build    # brings up db + broker + xnat
#   open http://localhost:8080   # first boot runs schema creation; give it a few minutes
#
# Service names MUST stay xnat-postgresql / xnat-activemq: the Dockerfile bakes those
# hostnames into xnat-conf.properties at build time (see Dockerfile ARG defaults).
services:
  xnat-postgresql:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: xnat
      POSTGRES_USER: xnat
      POSTGRES_PASSWORD: xnat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnat -d xnat"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - xnat-db:/var/lib/postgresql/data

  xnat-activemq:
    # Any ActiveMQ "Classic" image exposing OpenWire on 61616 works; the broker
    # runs unauthenticated by default so XNAT's admin/admin creds are ignored.
    image: apache/activemq-classic:6.1.4
    expose:
      - "61616"
    ports:
      - "8161:8161"   # web console (admin/admin) — optional

  xnat-mail:
    # Dev SMTP sink so notifications (new-user emails, etc.) never fail against a
    # missing mail server. XNAT reaches it as xnat-mail:1025; view captured mail at
    # http://localhost:8025. Point XNAT at it once via:
    #   POST /xapi/notifications/smtp?hostname=xnat-mail&port=1025
    # (build-known-state.sh does this automatically). Mailpit is multi-arch (arm64).
    image: axllent/mailpit:latest
    expose:
      - "1025"        # SMTP (in-network, reachable as xnat-mail:1025)
    ports:
      - "8025:8025"   # web UI

  xnat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TOMCAT_BASE: tomcat:9-jdk21-temurin
    depends_on:
      xnat-postgresql:
        condition: service_healthy
      xnat-activemq:
        condition: service_started
      xnat-mail:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - xnat-data:/data/xnat

volumes:
  xnat-db:
  xnat-data:
