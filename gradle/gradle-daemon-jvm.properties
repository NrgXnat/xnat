#This file is generated by updateDaemonJvm
#
# Pins the Gradle DAEMON to Java 21.
#
# Why: task actions that read jars themselves run in the daemon JVM, and JDK 22+
# tightened zip64 CEN validation so java.util.zip.ZipFile refuses to open some old
# jars on our classpath (aspectjweaver-1.8.10) with
#   java.util.zip.ZipException: Invalid CEN header (invalid zip64 extra data field size)
# That breaks :xnat-web:verifyNoOrphanedJavaxEE, which is wired into `check`.
# The java-common-conventions JDK-21 *toolchain* does NOT cover this: a toolchain
# governs forked compile/test JVMs, not the daemon. See docs/tomcat10-upgrade-status.md
# item 1-33 and the "Build / dependency-resolution gotchas" section of
# docs/plugin-migration-guide.md.
#
# Portable by design: this pins a *version*, not a path, so it works on any machine and
# on CI. No download URLs are listed (no toolchain-download repositories are configured
# in this build), so a local JDK 21 must be installed -- which is already true of any
# environment that can build this repo, since buildlogic.java-common-conventions requires
# a Java 21 toolchain to compile.
toolchainVersion=21
