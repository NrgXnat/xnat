plugins {
    id 'java-platform'
    id 'maven-publish'
}

group = 'org.nrg'

javaPlatform {
    allowDependencies()
}

dependencies {
    constraints {
        // Internal NRG modules
        api project(':test')
        api project(':framework')
        api project(':transaction')
        api project(':extattr')
        api project(':mail')
        api project(':prefs')
        api project(':automation')
        api project(':mizer')
        api project(':config')
        api project(':notify')
        api project(':dicomtools')
        api project(':dicom-image-utils')
        api project(':dicom-edit4')
        api project(':dicom-edit6')
        api project(':dicom-xnat-sop')
        api project(':dicom-xnat-util')
        api project(':xdat')
        api project(':spawner')
        // xnat-web has two publications (JAR + WAR); reference JAR coordinates explicitly
        api "org.nrg.xnat:web:${project.version}"
        api project(':xnat-data-builder')

        // External third-party libraries (from Version Catalog)

        // Spring Framework
        api libs.spring.core
        api libs.spring.beans
        api libs.spring.context
        api libs.spring.context.support
        api libs.spring.aop
        api libs.spring.expression
        api libs.spring.jdbc
        api libs.spring.jms
        api libs.spring.messaging
        api libs.spring.orm
        api libs.spring.oxm
        api libs.spring.tx
        api libs.spring.web
        api libs.spring.webmvc
        api libs.spring.test

        // Spring Security
        api libs.spring.security.spring.security.acl
        api libs.spring.security.spring.security.aspects
        api libs.spring.security.spring.security.config
        api libs.spring.security.spring.security.core
        api libs.spring.security.spring.security.ldap
        api libs.spring.security.spring.security.openid
        api libs.spring.security.spring.security.taglibs
        api libs.spring.security.spring.security.web
        api libs.spring.security.spring.security.test
        api libs.spring.security.spring.security.jwt
        api libs.spring.security.oauth2.spring.security.oauth2
        api libs.spring.ldap.spring.ldap.core

