plugins {
    id 'buildlogic.java-common-conventions'
    id 'java-library'
    id 'war'
    id 'groovy'
}

group = 'org.nrg.xnat'

// --- Global exclusions (must match original xnat-web/build.gradle exactly, see monorepo A6) ---
configurations.matching { it.name != 'xdatGenerator' }.configureEach {
    resolutionStrategy {
        // Phase 0b: bump commons-lang3 to 3.17 — Velocity 2.4.1's MethodMap.<clinit> calls
        // MethodUtils.getMethodObject() (added in lang3 3.15+); the previous 3.11 pin crashed every
        // $obj.method() introspection with NoSuchMethodError. 3.17 also provides Range.of(), so
        // commons-text (kept at 1.10.0 for the Tomcat-classpath concern) still resolves cleanly.
        force 'org.apache.commons:commons-lang3:3.17.0'
        force 'org.apache.commons:commons-text:1.10.0'
        // Logging unification (1-16): slf4j 2.0 + logback 1.5 (jakarta line). dcm4che 5.x's slf4j 2.x
        // is now natural, so the old slf4j-api:1.7.36 force is gone. Turbine 7 logs via
        // java.lang.System.Logger routed to slf4j (slf4j-jdk-platform-logging), so the Turbine-5.1
        // log4j-core alignment (log4j-api 2.23.1 vs core 2.14.1) is no longer needed; log4j bridges
        // stay excluded (below) so logback is the sole backend.
    }
    exclude group: 'ant',                      module: 'ant'
    // Phase-0b (Turbine 5.1): drop legacy Avalon + old Torque coords (see docs/dep-dryrun-phase0-findings.md)
    exclude group: 'avalon-framework'
    exclude group: 'torque'
    exclude group: 'avalon-logkit'
    exclude group: 'berkeleydb'
    exclude group: 'com.github.jai-imageio'
    exclude group: 'com.google.code.findbugs', module: 'annotations'
    exclude group: 'com.metaparadigm'
    exclude group: 'com.sun.jdmk',             module: 'jmxtools'
    exclude group: 'com.sun.jmx',              module: 'jmxri'
    exclude group: 'commons-beanutils',         module: 'commons-beanutils-core'
    exclude group: 'commons-betwixt'
    exclude group: 'commons-dbcp'
    exclude group: 'commons-email'
    exclude group: 'commons-logging'
    exclude group: 'commons-messenger'
    exclude group: 'commons-pool'
    exclude group: 'edu.ucar',                  module: 'netcdf'
    exclude group: 'excalibur-component'
    exclude group: 'excalibur-instrument'
    exclude group: 'excalibur-logger'
    exclude group: 'excalibur-pool'
    exclude group: 'fulcrum'
    exclude group: 'geronimo-spec'
    exclude group: 'hsqldb'
    exclude group: 'imagej'
    exclude group: 'jakarta-regexp'
    exclude group: 'jamon'
    exclude group: 'javax.jms',                 module: 'jms'
    exclude group: 'javax.mail',                module: 'mail'
    exclude group: 'javax.servlet',             module: 'servlet-api'
    exclude group: 'javax.sql',                 module: 'jdbc-stdext'
    exclude group: 'javax.transaction',         module: 'jta'
    exclude group: 'javax.xml',                 module: 'jsr173'
    exclude group: 'jdbc',                      module: 'jdbc'
    exclude group: 'jmock'
    exclude group: 'jms',                       module: 'jms'
    exclude group: 'jndi'
    exclude group: 'jython'
    exclude group: 'log4j',                     module: 'log4j'
    exclude group: 'mockobjects'
    exclude group: 'mysql'
    exclude group: 'net.sf.saxon'
    exclude group: 'ojb',                       module: 'ojb'
    exclude group: 'org.apache.geronimo.specs'
    exclude group: 'org.apache.struts'
    // hibernate-ehcache/jcache have no -jakarta build and transitively drag in the javax
    // org.hibernate:hibernate-core, which lands in WEB-INF/lib alongside hibernate-core-jakarta. Both
    // jars define the same org.hibernate.* classes (incl. BeanValidationIntegrator), so the Tomcat 10
    // web classloader can pick the javax one and fail to boot with
    // NoClassDefFoundError: javax/validation/ValidatorFactory. We only ever use hibernate-core-jakarta.
    exclude group: 'org.hibernate',             module: 'hibernate-core'
    exclude group: 'org.nrg',                   module: 'nrg'
    exclude group: 'org.nrg',                   module: 'nrgutil'
    exclude group: 'org.nrg',                   module: 'plexiviewer'
    exclude group: 'org.nrg.xdat',              module: 'beans'
    exclude group: 'org.nrg.xnat',              module: 'web'
    exclude group: 'org.slf4j',                 module: 'slf4j-log4j12'
    exclude group: 'quartz'
    exclude group: 'resources',                 module: 'resources'
    exclude group: 'servletapi'
    exclude group: 'stax',                      module: 'stax-api'
    exclude group: 'tomcat'
    exclude group: 'velocity'
    exclude group: 'xalan'
    exclude group: 'xerces'
    exclude group: 'xml-apis'
    exclude group: 'xml-resolver'
    exclude group: 'xmlrpc'
    exclude module: 'log4j-slf4j-impl'
    exclude module: 'pipelineCNDAXNAT'
    exclude module: 'slf4j-simple'

    // Old BouncyCastle (from itext/pixelmed transitive) — conflicts with bcpkix-jdk18on
    exclude group: 'bouncycastle'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk14'
    exclude group: 'org.bouncycastle', module: 'bcmail-jdk14'
    exclude group: 'org.bouncycastle', module: 'bctsp-jdk14'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'

    // batik from fop — not needed at runtime
    exclude group: 'batik'

    // antlr plugin (used by dicom-edit4/6) makes implementation extend antlr,
    // pulling the full antlr4 compiler + transitives (~16MB, mostly icu4j) into
    // runtimeClasspath. Only antlr-runtime / antlr4-runtime are needed at runtime.
    exclude group: 'org.antlr',          module: 'antlr4'
    exclude group: 'org.antlr',          module: 'antlr'
    exclude group: 'org.antlr',          module: 'ST4'
    exclude group: 'org.abego.treelayout', module: 'org.abego.treelayout.core'
    exclude group: 'com.ibm.icu',         module: 'icu4j'
}

