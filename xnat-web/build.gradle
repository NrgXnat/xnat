plugins {
    id 'buildlogic.java-common-conventions'
    id 'java-library'
    id 'war'
    id 'groovy'
}

group = 'org.nrg.xnat'

// --- Global exclusions (must match original xnat-web/build.gradle exactly, see monorepo A6) ---
configurations.matching { it.name != 'xdatGenerator' }.configureEach {
    resolutionStrategy {
        // commons-text 1.11.0 calls Range.of() which is missing in commons-lang3
        // bundled by Tomcat — pin to versions that work in production.
        force 'org.apache.commons:commons-lang3:3.11'
        force 'org.apache.commons:commons-text:1.10.0'
    }
    exclude group: 'ant',                      module: 'ant'
    exclude group: 'avalon-logkit'
    exclude group: 'berkeleydb'
    exclude group: 'com.github.jai-imageio'
    exclude group: 'com.google.code.findbugs', module: 'annotations'
    exclude group: 'com.metaparadigm'
    exclude group: 'com.sun.jdmk',             module: 'jmxtools'
    exclude group: 'com.sun.jmx',              module: 'jmxri'
    exclude group: 'commons-beanutils',         module: 'commons-beanutils-core'
    exclude group: 'commons-betwixt'
    exclude group: 'commons-dbcp'
    exclude group: 'commons-email'
    exclude group: 'commons-logging'
    exclude group: 'commons-messenger'
    exclude group: 'commons-pool'
    exclude group: 'edu.ucar',                  module: 'netcdf'
    exclude group: 'excalibur-component'
    exclude group: 'excalibur-instrument'
    exclude group: 'excalibur-logger'
    exclude group: 'excalibur-pool'
    exclude group: 'fulcrum'
    exclude group: 'geronimo-spec'
    exclude group: 'hsqldb'
    exclude group: 'imagej'
    exclude group: 'jakarta-regexp'
    exclude group: 'jamon'
    exclude group: 'javax.jms',                 module: 'jms'
    exclude group: 'javax.mail',                module: 'mail'
    exclude group: 'javax.servlet'
    exclude group: 'javax.sql',                 module: 'jdbc-stdext'
    exclude group: 'javax.transaction',         module: 'jta'
    exclude group: 'javax.xml',                 module: 'jsr173'
    exclude group: 'jdbc',                      module: 'jdbc'
    exclude group: 'jmock'
    exclude group: 'jms',                       module: 'jms'
    exclude group: 'jndi'
    exclude group: 'jython'
    exclude group: 'log4j',                     module: 'log4j'
    exclude group: 'mockobjects'
    exclude group: 'mysql'
    exclude group: 'net.sf.saxon'
    exclude group: 'ojb',                       module: 'ojb'
    exclude group: 'org.apache.geronimo.specs'
    exclude group: 'org.apache.struts'
    exclude group: 'org.nrg',                   module: 'nrg'
    exclude group: 'org.nrg',                   module: 'nrgutil'
    exclude group: 'org.nrg',                   module: 'plexiviewer'
    exclude group: 'org.nrg.xdat',              module: 'beans'
    exclude group: 'org.nrg.xnat',              module: 'web'
    exclude group: 'org.slf4j',                 module: 'slf4j-log4j12'
    exclude group: 'quartz'
    exclude group: 'resources',                 module: 'resources'
    exclude group: 'servletapi'
    exclude group: 'stax',                      module: 'stax-api'
    exclude group: 'tomcat'
    exclude group: 'velocity'
    exclude group: 'xalan'
    exclude group: 'xerces'
    exclude group: 'xml-apis'
    exclude group: 'xml-resolver'
    exclude group: 'xmlrpc'
    exclude module: 'log4j-slf4j-impl'
    exclude module: 'pipelineCNDAXNAT'
    exclude module: 'slf4j-simple'

    // Old BouncyCastle (from itext/pixelmed transitive) — conflicts with bcpkix-jdk18on
    exclude group: 'bouncycastle'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk14'
    exclude group: 'org.bouncycastle', module: 'bcmail-jdk14'
    exclude group: 'org.bouncycastle', module: 'bctsp-jdk14'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'

    // batik from fop — not needed at runtime
    exclude group: 'batik'

    // antlr plugin (used by dicom-edit4/6) makes implementation extend antlr,
    // pulling the full antlr4 compiler + transitives (~16MB, mostly icu4j) into
    // runtimeClasspath. Only antlr-runtime / antlr4-runtime are needed at runtime.
    exclude group: 'org.antlr',          module: 'antlr4'
    exclude group: 'org.antlr',          module: 'antlr'
    exclude group: 'org.antlr',          module: 'ST4'
    exclude group: 'org.abego.treelayout', module: 'org.abego.treelayout.core'
    exclude group: 'com.ibm.icu',         module: 'icu4j'
}

dependencies {
    // --- Annotation processors ---
    annotationProcessor project(':framework')
    annotationProcessor libs.google.auto.value
    annotationProcessor libs.metainf.services.metainf.services

    // --- Internal monorepo modules ---
    // Satellite modules (xnat-data-models, session-builders, ecat4xnat,
    // prearc-importer, dicom-xnat-mx) are merged into xnat-web/src/ — no project dep needed
    api project(':xdat')
    api project(':framework')
    api project(':extattr')
    implementation project(':spawner')
    implementation project(':transaction')
    implementation project(':prefs')
    implementation project(':config')
    implementation project(':automation')
    implementation project(':dicomtools')
    implementation project(':mail')
    implementation project(':notify')
    implementation project(':mizer')
    implementation project(':dicom-xnat-sop')
    implementation project(':dicom-xnat-util')
    implementation project(':dicom-image-utils')
    implementation project(':dicom-edit4')
    implementation project(':dicom-edit6')

    // --- Spring ---
    api libs.spring.web
    api libs.spring.jms
    api libs.spring.jdbc
    api libs.spring.beans
    api libs.spring.context
    api libs.spring.core
    implementation libs.spring.aop
    implementation libs.spring.context.support
    implementation libs.spring.messaging
    implementation libs.spring.orm
    implementation libs.spring.oxm
    implementation libs.spring.tx
    implementation libs.spring.webmvc

    // --- Spring Security ---
    api libs.spring.security.spring.security.ldap
    implementation libs.spring.security.spring.security.acl
    implementation libs.spring.security.spring.security.aspects
    implementation libs.spring.security.spring.security.config
    implementation libs.spring.security.spring.security.taglibs
    implementation libs.spring.ldap.spring.ldap.core

    // --- Hibernate ---
    implementation libs.hibernate.core
    implementation libs.hibernate.jcache
    implementation libs.hibernate.validator
    implementation libs.hibernate.envers
    // version catalog cannot express classifiers — jakarta variant needed for Hibernate 6
    implementation 'org.ehcache:ehcache:3.10.8:jakarta'
    implementation libs.hypersistence.utils.hibernate63
    implementation(libs.redisson.redisson) {
        // redisson 3.22 pulls reactor-core 3.x; framework needs 2.x (forced in convention plugin).
        exclude group: 'io.projectreactor', module: 'reactor-core'
    }

    // --- DICOM dcm4che 2.x ---
    implementation libs.dcm4che.core
    implementation libs.dcm4che.image
    implementation libs.dcm4che.imageio
    implementation libs.dcm4che.imageio.rle
    implementation libs.dcm4che.iod
    implementation libs.dcm4che.net
    // --- DICOM dcm4che 5.x (dual version coexistence) ---
    implementation libs.dcm4che5.dcm4che.core
    implementation libs.dcm4che5.dcm4che.image
    implementation libs.dcm4che5.dcm4che.imageio
    implementation libs.dcm4che5.dcm4che.net
    implementation libs.imagej.ij

    // --- Jackson ---
    implementation libs.jackson.annotations
    implementation libs.jackson.core
    implementation libs.jackson.databind
    implementation libs.jackson.dataformat.yaml
    implementation libs.jackson.datatype.guava
    implementation libs.jackson.module.parameter.names
    implementation libs.jackson.datatype.jdk8
    implementation libs.jackson.datatype.jsr310

    // --- Springfox / Swagger ---
    implementation libs.springdoc.openapi.starter.webmvc.ui
    implementation libs.spring.boot.autoconfigure

    // --- Jakarta ORO (transitive from restlet in Maven) ---
    implementation 'oro:oro:2.0.8'

    // --- Restlet ---
    implementation libs.restlet.org.restlet
    implementation libs.restlet.com.noelios.restlet
    implementation libs.restlet.com.noelios.restlet.ext.servlet
    implementation libs.restlet.org.restlet.ext.fileupload

    // --- JMS ---
    implementation libs.jakarta.jms.api

    // --- Reactor (from satellite merge) ---
    implementation libs.reactor.bus

    // --- Turbine/Torque (from satellite merge) ---
    // transitive=false would cut off torque (turbine's core dep) and cause
    // NoClassDefFoundError: GroupPeerManagerConstants at Tomcat runtime.
    // Use precise excludes for legacy/conflicting artifacts instead.
    implementation(libs.turbine.turbine) {
        exclude group: 'commons-dbcp'
        exclude group: 'commons-email'
        exclude group: 'commons-pool'
        exclude group: 'fulcrum'
        exclude group: 'javax.activation', module: 'activation'
        exclude group: 'javax.mail'
        exclude group: 'javax.servlet'
        exclude group: 'jython'
        exclude group: 'xalan'
        exclude group: 'xml-apis'
        exclude group: 'log4j',           module: 'log4j'
        exclude group: 'berkeleydb'
        exclude group: 'javax.sql'
        exclude group: 'jndi'
        exclude group: 'mysql'
        exclude group: 'tomcat'
        exclude group: 'xerces'
    }
    implementation libs.torque.village
    implementation(libs.apache.velocity) { transitive = false }
    implementation libs.ecs.ecs

    // --- Commons ---
    implementation libs.commons.beanutils
    implementation libs.commons.codec
    implementation libs.commons.collections
    implementation libs.commons.configuration
    implementation libs.commons.digester
    implementation libs.commons.discovery
    implementation libs.commons.fileupload
    implementation libs.commons.net
    implementation libs.commons.configuration2
    implementation libs.commons.math
    implementation libs.commons.text
    implementation libs.commons.io
    implementation libs.commons.lang3
    implementation libs.commons.pool2
    implementation libs.commons.compress

    // --- HTTP / Logging / Misc ---
    implementation libs.httpcomponents.httpclient
    implementation libs.httpcomponents.httpcore
    implementation libs.httpcomponents.httpcore.nio
    implementation libs.httpcomponents.httpmime
    implementation libs.groovy.all
    implementation libs.bitwalker.useragentutils
    implementation libs.twmacinta.fast.md5
    implementation libs.h2database.h2
    implementation libs.msv.core
    implementation libs.getopt.java.getopt
    implementation libs.quartz.scheduler.quartz
    implementation libs.reflections.reflections
    implementation libs.apache.xbean.spring
    implementation libs.msv.xsdlib
    implementation libs.servlet.jstl
    implementation libs.google.gson
    implementation libs.google.guava
    implementation libs.postgresql.postgresql
    implementation libs.ttddyy.datasource.proxy
    implementation libs.activemq.broker
    implementation libs.activemq.spring
    implementation libs.activemq.kahadb.store
    implementation libs.activemq.jdbc.store
    implementation libs.jakarta.inject.api
    implementation libs.dom4j.dom4j
    implementation libs.slf4j.api
    implementation libs.slf4j.jul.to.slf4j
    implementation libs.slf4j.jcl.over.slf4j
    implementation libs.slf4j.log4j.over.slf4j
    implementation libs.logback.classic
    implementation libs.logback.core
    implementation libs.logback.logstash.logback.encoder
    implementation libs.google.auto.value.annotations
    implementation libs.jsonpath.json.path
    implementation libs.json.json
    implementation libs.aspectj.weaver
    implementation libs.aspectj.rt

    // --- Provided (container) ---
    compileOnly libs.google.jsr305
    compileOnly libs.jakarta.servlet.api
    compileOnly libs.metainf.services.metainf.services

    // --- Runtime only ---
    runtimeOnly libs.apache.ant
    runtimeOnly libs.cglib.cglib
    runtimeOnly libs.zaxxer.hikaricp
    runtimeOnly libs.hsqldb.hsqldb
    runtimeOnly(libs.media.jai.imageio) {
        exclude group: 'javax.media', module: 'jai_core'
    }
    runtimeOnly libs.javamelody.core
    runtimeOnly libs.javassist.javassist
    runtimeOnly libs.python.jython.standalone
    runtimeOnly libs.bouncycastle.bcpkix.jdk18on

    // --- Test ---
    testImplementation project(':test')
    testImplementation libs.jakarta.servlet.api
    testImplementation libs.junit.junit
    testImplementation libs.spring.test
    testImplementation libs.assertj.core
    testImplementation libs.spring.security.spring.security.test
    testImplementation libs.spring.security.spring.security.config
    testImplementation libs.hamcrest.hamcrest
    testImplementation libs.mockito.core
    testImplementation libs.testcontainers.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.postgresql
    testImplementation 'org.awaitility:awaitility:4.2.0'
    testImplementation libs.commons.dbcp2
}

// junit-3.8.1 leaks from itext:2.1.7 transitives. Cannot use a global exclude
// because junit/jsr305 are needed at compile/test time.
war {
    rootSpec.exclude '**/junit-*.jar'
}

// --- XDAT code generation (replaces xdat-data-builder plugin) ---

configurations {
    xdatGenerator
}

dependencies {
    xdatGenerator project(':xdat')
    xdatGenerator project(':config')
    xdatGenerator project(':framework')
    xdatGenerator project(':notify')
    xdatGenerator project(':prefs')
    xdatGenerator libs.commons.io
}

def generatedDir       = layout.buildDirectory.dir('xnat-generated')
def generatedJava      = generatedDir.map { it.dir('src/main/java') }
def generatedResources = generatedDir.map { it.dir('src/main/resources') }

sourceSets {
    main {
        java      { srcDir generatedJava }
        resources { srcDir generatedResources }
    }
}

// CC-safe helper: provides FileSystemOperations without referencing project at execution time
abstract class FileSystemOperationsHolder {
    @javax.inject.Inject
    abstract org.gradle.api.file.FileSystemOperations getFsOps()
}

tasks.register('generateXnatCode', JavaExec) {
    group       = 'xnat'
    description = 'Generates Java beans and resources from XNAT XSD schemas.'

    classpath  = configurations.xdatGenerator
    mainClass  = 'org.nrg.xft.generators.GenerateResources'

    def schemaDir    = file('src/main/resources/schemas')
    def javaSrcDir   = file('src/main/java')
    def javaOut      = generatedJava.get().asFile
    def templatesOut = generatedResources.get().dir('META-INF/resources/base-templates/screens').asFile
    def resourcesOut = generatedResources.get().asFile
    def jsOut        = generatedResources.get().dir('META-INF/resources/scripts').asFile

    // Capture at configuration time so doFirst doesn't access project at execution time
    def fsHolder = project.objects.newInstance(FileSystemOperationsHolder)
    def schemasDest = generatedResources.get().dir('schemas').asFile

    args = [
        '-name',       project.name,
        '-schemaDir',  schemaDir.absolutePath,
        '-javaDir',    javaOut.absolutePath,
        '-templatesDir', templatesOut.absolutePath,
        '-srcControlDir', javaSrcDir.absolutePath,
        '-beanDir',    javaOut.absolutePath,
        '-beanPropsDir', resourcesOut.absolutePath,
        '-javascriptDir', jsOut.absolutePath,
    ]

    inputs.dir schemaDir
    outputs.dir generatedDir

    doFirst {
        def genDir = generatedDir.get().asFile
        if (genDir.exists()) { genDir.deleteDir() }
        fsHolder.fsOps.copy {
            from schemaDir
            into schemasDest
            include '**/*.xsd', '**/*.xml'
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'generateXnatCode'
    options.fork = true
    options.forkOptions.memoryMaximumSize = '4g'
}
tasks.named('processResources') {
    dependsOn 'generateXnatCode'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('sourcesJar') {
    dependsOn 'generateXnatCode'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('javadoc') {
    failOnError = false
}

// Original Maven coordinates: JAR -> org.nrg.xnat:web, WAR -> org.nrg.xnat.web:xnat-web
publishing {
    publications {
        maven {
            artifactId = 'web'
        }
        mavenWar(MavenPublication) {
            groupId = 'org.nrg.xnat.web'
            artifactId = 'xnat-web'
            from components.web
        }
    }
}
